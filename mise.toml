min_version = "2026.4.16"

[settings]
task.source_freshness_hash_contents = true

[tools]
actionlint = "1.7.12"
fzf = "0.74.5"
gh = "2.102.0"
jq = "1.8.2"
shellcheck = "0.11.0"

[task_config]
includes = ["mise-tasks"]

[tasks."lint:shell"]
description = "Check shared Bash tasks and test scripts with ShellCheck"
sources = ["mise.toml", "mise-tasks/**/*", "tests/**/*", ".shellcheckrc"]
outputs = { auto = true }
run = "find mise-tasks tests -type f -exec shellcheck --severity=info {} +"

[tasks."lint:actions"]
description = "Validate GitHub Actions workflows with actionlint"
sources = ["mise.toml", ".github/workflows/**/*", ".github/actionlint.*", ".shellcheckrc"]
outputs = { auto = true }
run = "actionlint"

[tasks."lint:json"]
description = "Validate Renovate presets and package JSON"
sources = ["mise.toml", "default.json", "payload.json", "renovate.json", "biome/package.json"]
outputs = { auto = true }
run = "jq empty default.json payload.json renovate.json biome/package.json"

[tasks.lint]
description = "Run all repository linters"
depends = ["lint:*"]

[tasks.test]
description = "Run worktree and Neon cleanup regression tests against mocked CLIs"
sources = ["mise.toml", "mise-tasks/worktree/cleanup", "mise-tasks/db/cleanup", "tests/**/*"]
outputs = { auto = true }
run = ["/bin/bash tests/worktree-cleanup.sh", "/bin/bash tests/db-cleanup.sh"]

[tasks.ci]
description = "Run the same lint and regression checks as GitHub Actions"
depends = ["lint", "test"]
