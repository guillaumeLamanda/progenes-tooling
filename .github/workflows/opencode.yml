name: opencode

# Caller (on: issue_comment / pull_request_review_comment, types: [created]):
#   jobs:
#     opencode:
#       uses: guillaumeLamanda/progenes-tooling/.github/workflows/opencode.yml@v1
#       permissions:
#         id-token: write
#         contents: read
#         pull-requests: read
#         issues: read
#       with:
#         model: vercel/deepseek/deepseek-v4-pro
#       secrets:
#         AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

on:
  workflow_call:
    inputs:
      model:
        required: true
        type: string
    secrets:
      AI_GATEWAY_API_KEY:
        required: true

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        with:
          model: ${{ inputs.model }}
