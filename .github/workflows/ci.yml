name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mise and tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24

      - name: Identify runner image
        id: runner_image
        run: |
          image_os=$(printenv ImageOS)
          image_version=$(printenv ImageVersion)
          printf 'version=%s-%s\n' "$image_os" "$image_version" >> "$GITHUB_OUTPUT"

      - name: Restore task freshness state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mise-task-state
          key: task-state-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner_image.outputs.version }}-${{ hashFiles('mise.toml', 'mise-tasks/**', 'tests/**', '.github/workflows/**', '.github/actionlint.*', '.shellcheckrc', '*.json', 'biome/package.json') }}
          restore-keys: |
            task-state-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner_image.outputs.version }}-

      - name: Run checks
        env:
          MISE_STATE_DIR: ${{ runner.temp }}/mise-task-state
        run: mise run ci
